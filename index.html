<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>صيدلية إيمان السيد عبد الوهاب محمد</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0E172F">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Alexandria', sans-serif; background-color: #050a15; }
        .bg-cobalt { background-color: #0D47A1; }
        .text-cobalt { color: #0D47A1; }
        .bg-crimson { background-color: #C62828; }
        .text-crimson { color: #C62828; }
        .text-gold { color: #FFD700; }
        
        .toast { visibility: hidden; opacity: 0; transition: visibility 0s, opacity 0.3s linear, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform: translate(-50%, 20px); }
        .toast.show { visibility: visible; opacity: 1; transform: translate(-50%, 0); }

        .vf-red { background-color: #e60000; }
        .instapay-grad { background: linear-gradient(135deg, #7c3aed 0%, #db2777 100%); }
        
        button, a { -webkit-tap-highlight-color: transparent; outline: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Pulsing Call-to-Action Animation */
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
            50% { transform: scale(1.03); box-shadow: 0 0 15px rgba(34, 197, 94, 0.8); }
        }
        .btn-cta {
            animation: pulse-glow 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="min-h-[100dvh] w-full flex items-center justify-center m-0 p-1 bg-[#050a15]">

    <!-- Main Wrapper: Floating card with thin relaxing border and 15% curve -->
    <div class="h-[98dvh] w-full max-w-[420px] overflow-hidden flex flex-col bg-[#0E172F] text-white relative rounded-[16px] shadow-[0_0_20px_rgba(96,165,250,0.1)] border border-[#60a5fa]/40">

        <!-- Main Content Area -->
        <div class="flex-1 overflow-y-auto overflow-x-hidden no-scrollbar flex flex-col w-full">
            
            <!-- 1. Photo (Full natural size without cropping) -->
            <div class="w-full shrink-0 bg-[#0E172F] flex items-center justify-center relative">
                <img src="صيدلية ايمان اليافطة الجديدة.png" alt="واجهة الصيدلية" class="w-full h-auto rounded-t-[16px]">
            </div>
            
            <!-- Inner Padding for content below photo -->
            <div class="flex flex-col gap-1 px-1.5 pt-1 pb-1">
                
                <!-- 2. Services Grid -->
                <div class="bg-[#151f38] rounded-xl p-1.5 shadow-sm flex flex-col justify-center shrink-0">
                    <h3 class="text-[11px] font-extrabold text-center text-[#FFD700] mb-1">الخدمات</h3>
                    
                    <div class="w-full grid grid-cols-3 gap-y-1.5 gap-x-1">
                        
                        <!-- 1. ضغط -->
                        <div class="flex flex-col items-center gap-0.5 group cursor-pointer">
                            <div class="w-12 h-12 rounded-full bg-white flex items-center justify-center shadow-md transition group-hover:scale-105 border border-gray-200">
                                <img src="blood-pressure.png" onerror="this.outerHTML='<span class=\'text-[24px] leading-none\'>🩺</span>'" class="h-7 object-contain" alt="جهاز ضغط">
                            </div>
                            <span class="text-[9px] font-bold text-gray-200 leading-tight">ضغط</span>
                        </div>

                        <!-- 2. سكر -->
                        <div class="flex flex-col items-center gap-0.5 group cursor-pointer">
                            <div class="w-12 h-12 rounded-full bg-white flex items-center justify-center shadow-md transition group-hover:scale-105 border border-gray-200">
                                <img src="glucose-meter.png" onerror="this.outerHTML='<span class=\'text-[24px] leading-none\'>🩸</span>'" class="h-7 object-contain" alt="جهاز سكر">
                            </div>
                            <span class="text-[9px] font-bold text-gray-200 leading-tight">سكر</span>
                        </div>

                        <!-- 3. InBody -->
                        <div class="flex flex-col items-center gap-0.5 group cursor-pointer">
                            <div class="w-12 h-12 rounded-full bg-white flex items-center justify-center shadow-md transition group-hover:scale-105 border border-gray-200">
                                <img src="inbody-scale.png" onerror="this.outerHTML='<span class=\'text-[24px] leading-none\'>⚖️</span>'" class="h-7 object-contain" alt="جهاز InBody">
                            </div>
                            <span class="text-[9px] font-bold text-gray-200 leading-tight">InBody</span>
                        </div>

                        <!-- 4. توصيل -->
                        <div class="flex flex-col items-center gap-0.5 group cursor-pointer">
                            <div class="w-12 h-12 rounded-full bg-white flex items-center justify-center shadow-md transition group-hover:scale-105 border border-gray-200">
                                <img src="delivery.png" onerror="this.outerHTML='<span class=\'text-[24px] leading-none\'>🛵</span>'" class="h-7 object-contain" alt="توصيل">
                            </div>
                            <span class="text-[9px] font-bold text-gray-200 leading-tight">توصيل</span>
                        </div>

                        <!-- 5. طلبات -->
                        <a href="https://www.talabat.com/egypt" target="_blank" class="flex flex-col items-center gap-0.5 group">
                            <div class="w-12 h-12 rounded-full bg-[#FF5A00] flex items-center justify-center shadow-md transition group-hover:scale-105 overflow-hidden">
                                <img src="talabat.png" onerror="this.outerHTML='<span class=\'bg-[#FF5A00] text-white font-black text-[10px] px-1 py-0.5 rounded leading-none\'>talabat</span>'" class="w-full h-full object-cover" alt="طلبات">
                            </div>
                            <span class="text-[9px] font-bold text-gray-200 leading-tight">طلبات</span>
                        </a>

                        <!-- 6. Visa -->
                        <div class="flex flex-col items-center gap-0.5 group cursor-pointer">
                            <div class="w-12 h-12 rounded-full bg-white flex items-center justify-center shadow-md transition group-hover:scale-105 border border-gray-200">
                                <img src="visa.png" onerror="this.outerHTML='<i class=\'fa-brands fa-cc-visa text-[28px] text-[#1A1F71] leading-none\'></i>'" class="w-8 object-contain" alt="فيزا">
                            </div>
                            <span class="text-[9px] font-bold text-gray-200 leading-tight">دفع فيزا</span>
                        </div>

                    </div>
                </div>

                <!-- 3. Share & Location Buttons -->
                <div class="flex gap-1.5 shrink-0">
                    <button onclick="sharePage()" class="flex-1 rounded-xl flex flex-col items-center justify-center py-1.5 relative bg-[#1c2746] shadow-sm border border-[#3a4f8a] transition hover:bg-[#25335b] active:scale-95 group">
                        <i class="fa-solid fa-share-nodes text-[18px] text-green-400 mb-0.5 group-hover:-translate-y-1 transition-transform"></i>
                        <span class="text-[10px] font-bold text-gray-200">مشاركة الصفحة</span>
                    </button>
                    
                    <a href="https://maps.google.com" target="_blank" class="flex-1 rounded-xl flex flex-col items-center justify-center py-1.5 relative bg-[#1c2746] shadow-sm border border-[#3a4f8a] transition hover:bg-[#25335b] active:scale-95 group">
                        <i class="fa-solid fa-map-location-dot text-[18px] text-red-400 mb-0.5 group-hover:-translate-y-1 transition-transform"></i>
                        <span class="text-[10px] font-bold text-gray-200">فتح اللوكيشن</span>
                    </a>
                </div>

                <!-- 4. Social & Payment -->
                <div class="bg-[#151f38] rounded-xl py-1.5 px-1.5 shrink-0 shadow-sm flex justify-between items-center gap-1">
                    
                    <!-- Facebook -->
                    <a href="#" class="flex flex-col items-center gap-1 flex-1 group">
                        <div class="w-[46px] h-[46px] rounded-full bg-[#1877F2] text-white flex items-center justify-center text-2xl shadow-md hover:-translate-y-1 transition-transform active:scale-95">
                            <i class="fa-brands fa-facebook-f"></i>
                        </div>
                        <span class="text-[9px] font-bold text-gray-200">فيسبوك</span>
                    </a>

                    <!-- Instagram -->
                    <a href="#" class="flex flex-col items-center gap-1 flex-1 group">
                        <div class="w-[46px] h-[46px] rounded-full bg-gradient-to-tr from-[#f09433] via-[#e6683c] to-[#bc1888] text-white flex items-center justify-center text-2xl shadow-md hover:-translate-y-1 transition-transform active:scale-95">
                            <i class="fa-brands fa-instagram"></i>
                        </div>
                        <span class="text-[9px] font-bold text-gray-200">إنستجرام</span>
                    </a>

                    <!-- Vodafone Cash -->
                    <button onclick="copyToClipboard('01018921130', 'تم نسخ رقم محفظة الكاش')" class="flex flex-col items-center gap-1 flex-1 group">
                        <div class="w-[46px] h-[46px] rounded-full vf-red text-white flex items-center justify-center text-xl shadow-md hover:-translate-y-1 transition-transform active:scale-95">
                            <i class="fa-solid fa-wallet"></i>
                        </div>
                        <span class="text-[9px] font-bold text-gray-200">كاش</span>
                    </button>

                    <!-- InstaPay -->
                    <button onclick="copyToClipboard('01018921130', 'تم نسخ رقم إنستاباي')" class="flex flex-col items-center gap-1 flex-1 group">
                        <div class="w-[46px] h-[46px] rounded-full instapay-grad text-white flex items-center justify-center font-black italic text-lg shadow-md hover:-translate-y-1 transition-transform active:scale-95">
                            IP
                        </div>
                        <span class="text-[9px] font-bold text-gray-200">إنستاباي</span>
                    </button>

                </div>
            </div>

        </div>

        <!-- 6. Footer (Install App + Offers + Dialers) -->
        <div class="shrink-0 bg-[#0E172F] z-10 flex flex-col gap-1 p-1.5 border-t border-[#151f38] relative">
            
            <!-- Install as App Button (Animated Green CTA) -->
            <button onclick="installApp()" class="w-full bg-[#dcfce7] text-[#166534] py-1.5 rounded-xl flex items-center justify-center gap-1.5 font-extrabold shadow-md hover:bg-[#bbf7d0] transition-all duration-300 btn-cta">
                <i class="fa-solid fa-download text-[16px]"></i>
                <span class="text-[12px]">تثبيت الصيدلية كـ تطبيق الموبايل</span>
            </button>

            <!-- Offers Full Width -->
            <button onclick="openOffers()" class="w-full bg-gradient-to-r from-[#FFDF00] via-[#FFE84D] to-[#FFB800] text-[#0D47A1] py-2.5 rounded-xl flex items-center justify-center gap-1.5 font-extrabold shadow-lg hover:brightness-105 transition active:scale-95 border border-[#FFD700]">
                <i class="fa-solid fa-tags text-[18px] drop-shadow-sm text-[#0D47A1]"></i>
                <span class="text-[13px]">العروض الحصرية</span>
            </button>

            <!-- Dialers -->
            <div class="flex gap-1.5">
                <a href="https://wa.me/201018921130" target="_blank" class="flex-1 bg-[#25D366] text-white py-2.5 px-1 rounded-xl flex items-center justify-center gap-1.5 font-bold shadow-md hover:bg-[#20bd5a] transition active:scale-95 btn-cta">
                    <i class="fa-brands fa-whatsapp text-[16px]"></i>
                    <span class="text-[11px] whitespace-nowrap">واتس</span>
                </a>
                
                <a href="tel:0312423848" class="flex-1 bg-cobalt text-white py-2.5 px-1 rounded-xl flex items-center justify-center gap-1.5 font-bold shadow-md hover:bg-blue-800 transition active:scale-95">
                    <i class="fa-solid fa-mobile-screen-button text-[16px]"></i>
                    <span class="text-[11px] whitespace-nowrap">موبايل</span>
                </a>
                
                <a href="tel:0237824078" class="flex-1 bg-crimson text-white py-2.5 px-1 rounded-xl flex items-center justify-center gap-1.5 font-bold shadow-md hover:bg-red-800 transition active:scale-95">
                    <i class="fa-solid fa-phone-flip text-[16px]"></i>
                    <span class="text-[11px] whitespace-nowrap">أرضي</span>
                </a>
            </div>
            
        </div>

    </div>

    <!-- Offers Fullscreen Modal (Iframe) Dark Mode -->
    <div id="offersOverlay" class="fixed inset-0 bg-[#0E172F] z-[100] transform translate-y-full transition-transform duration-300 flex flex-col w-full sm:max-w-[420px] mx-auto sm:rounded-[16px] sm:h-[95vh] sm:mt-[2.5vh] overflow-hidden shadow-2xl border border-[#FFD700]">
        <!-- Header -->
        <div class="bg-[#151f38] text-white h-14 flex items-center px-4 shadow-md shrink-0 border-b border-[#1e2a4a]">
            <button onclick="closeOffers()" class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 active:bg-white/30 transition text-gray-300">
                <i class="fa-solid fa-arrow-right"></i>
            </button>
            <span class="font-extrabold text-sm mr-4 text-[#FFD700] drop-shadow-sm">العروض الحصرية</span>
        </div>
        <!-- Iframe -->
        <div class="flex-1 bg-[#0E172F] relative w-full h-full">
            <iframe id="offersIframe" class="absolute inset-0 w-full h-full border-none bg-white" src=""></iframe>
            <div class="absolute inset-0 flex items-center justify-center -z-10 text-gray-500 font-bold text-sm">
                جاري تحميل العروض...
            </div>
        </div>
    </div>

    <!-- Offline Map / Image Player Modal -->
    <div id="mapOverlay" class="fixed inset-0 bg-[#0E172F] z-[110] transform translate-y-full transition-transform duration-300 flex flex-col w-full sm:max-w-[420px] mx-auto sm:rounded-[16px] sm:h-[95vh] sm:mt-[2.5vh] overflow-hidden shadow-2xl border border-blue-500">
        <!-- Header -->
        <div class="bg-[#151f38] text-white h-14 flex items-center px-4 shadow-md shrink-0 border-b border-[#1e2a4a]">
            <button onclick="closeMapPlayer()" class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 active:bg-white/30 transition text-gray-300">
                <i class="fa-solid fa-arrow-right"></i>
            </button>
            <span class="font-extrabold text-sm mr-4 text-blue-400 drop-shadow-sm">مستعرض الصور والخريطة</span>
        </div>
        <!-- Content -->
        <div class="flex-1 bg-[#050a15] flex flex-col items-center justify-center p-4 relative">
            <i class="fa-solid fa-map text-8xl text-[#1c2746] mb-4"></i>
            <p class="text-gray-400 font-bold text-center text-sm">هنا يمكنك وضع الـ iframe الخاص بالخريطة الأوفلاين<br>أو مستعرض الصور (Slider)</p>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast fixed bottom-[120px] left-1/2 bg-[#1c2746] text-[#FFD700] px-4 py-3 rounded-xl text-[10px] shadow-2xl z-50 text-center font-bold flex flex-col items-center justify-center gap-1 border border-[#FFD700] w-[80%] max-w-[300px]">
        <i class="fa-solid fa-circle-info text-[#FFD700] text-base mb-1"></i>
        <span id="toast-msg">تم النسخ بنجاح</span>
    </div>

    <script>
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator && window.location.protocol !== 'file:') {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker Registered!', reg))
                    .catch(err => console.log('Service Worker registration failed: ', err));
            });
        }

        // PWA Install Prompt Logic
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    deferredPrompt = null;
                });
            } else {
                showToast('للتثبيت: من إعدادات المتصفح (زر المشاركة) اختر "إضافة للشاشة الرئيسية" (Add to Home Screen)');
            }
        }

        function copyToClipboard(text, msg) {
            navigator.clipboard.writeText(text).then(() => {
                showToast(msg);
            }).catch(err => {
                showToast(msg + ' (محاكاة)');
            });
        }
        
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 4000);
        }

        // Native Share Page API
        function sharePage() {
            if (navigator.share) {
                navigator.share({
                    title: 'صيدلية إيمان السيد عبد الوهاب',
                    text: 'تواصل معنا واستفد من خدماتنا وعروضنا الحصرية!',
                    url: window.location.href
                }).catch((error) => console.log('Error sharing:', error));
            } else {
                copyToClipboard(window.location.href, 'تم نسخ رابط الصفحة للمشاركة!');
            }
        }

        // --- Offers Iframe Modal Logic with Hash routing ---
        function openOffers() {
            const overlay = document.getElementById('offersOverlay');
            const iframe = document.getElementById('offersIframe');
            
            if (!iframe.src || iframe.src === window.location.href) {
                iframe.src = "https://www.google.com/search?igu=1&q=offers";
            }
            
            overlay.classList.remove('translate-y-full');
            window.history.pushState({ modal: 'offers' }, '', '#offers');
        }

        function closeOffers() {
            if (window.location.hash === '#offers') window.history.back();
            else document.getElementById('offersOverlay').classList.add('translate-y-full');
        }

        // --- Map Player Logic ---
        function openMapPlayer() {
            const overlay = document.getElementById('mapOverlay');
            overlay.classList.remove('translate-y-full');
            window.history.pushState({ modal: 'map' }, '', '#map');
        }

        function closeMapPlayer() {
            if (window.location.hash === '#map') window.history.back();
            else document.getElementById('mapOverlay').classList.add('translate-y-full');
        }

        // --- Global Hash Router ---
        window.addEventListener('popstate', (event) => {
            const offersOverlay = document.getElementById('offersOverlay');
            const mapOverlay = document.getElementById('mapOverlay');
            
            if (window.location.hash === '#offers') {
                offersOverlay.classList.remove('translate-y-full');
                mapOverlay.classList.add('translate-y-full');
            } else if (window.location.hash === '#map') {
                mapOverlay.classList.remove('translate-y-full');
                offersOverlay.classList.add('translate-y-full');
            } else {
                offersOverlay.classList.add('translate-y-full');
                mapOverlay.classList.add('translate-y-full');
            }
        });
    </script>
</body>
</html>
